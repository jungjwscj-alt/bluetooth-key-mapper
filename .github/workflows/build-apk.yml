name: Build Bluetooth Key Mapper APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:assembleFullDebug :app:assembleLiteDebug
      - name: Validate APK permissions and signatures
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          FULL=app/build/outputs/apk/full/debug/app-full-debug.apk
          LITE=app/build/outputs/apk/lite/debug/app-lite-debug.apk
          "$AAPT" dump xmltree "$FULL" AndroidManifest.xml > full-manifest.txt
          "$AAPT" dump xmltree "$LITE" AndroidManifest.xml > lite-manifest.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' full-manifest.txt
          if grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' lite-manifest.txt; then
            echo "Lite unexpectedly declares accessibility service" >&2
            exit 1
          fi
          "$SIGNER" verify --verbose "$FULL"
          "$SIGNER" verify --verbose "$LITE"
      - name: Calculate SHA-256
        run: |
          sha256sum app/build/outputs/apk/full/debug/app-full-debug.apk > app/build/outputs/apk/full/debug/app-full-debug.apk.sha256
          sha256sum app/build/outputs/apk/lite/debug/app-lite-debug.apk > app/build/outputs/apk/lite/debug/app-lite-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Bluetooth-Key-Mapper-v1.3-Full-and-Lite
          path: |
            app/build/outputs/apk/full/debug/app-full-debug.apk
            app/build/outputs/apk/full/debug/app-full-debug.apk.sha256
            app/build/outputs/apk/lite/debug/app-lite-debug.apk
            app/build/outputs/apk/lite/debug/app-lite-debug.apk.sha256
          if-no-files-found: error

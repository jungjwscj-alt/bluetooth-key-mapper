plugins { id 'com.android.application' }
android {
 namespace 'com.bluekeymapper.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.bluekeymapper.app'
  minSdk 27
  targetSdk 35
  versionCode 3
  versionName '1.2.0'
 }
 flavorDimensions 'edition'
 productFlavors {
  full { dimension 'edition' }
  lite { dimension 'edition'; applicationIdSuffix '.lite'; versionNameSuffix '-lite' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
